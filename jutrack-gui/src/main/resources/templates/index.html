<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>juTrack – Web Console</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1f2b5f, #0c0f28 55%);
            --panel-bg: rgba(12, 15, 40, 0.72);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #ffb347;
            --accent-strong: #ff8e53;
            --fg: #f7f7fb;
            --muted: rgba(247, 247, 251, 0.65);
            --error: #ff6b6b;
            font-family: "Space Grotesk", "IBM Plex Sans", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--fg);
        }

        .page {
            padding: 2rem clamp(1rem, 3vw, 3rem);
        }

        header {
            margin-bottom: 2rem;
            animation: fadeIn 400ms ease-out;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            letter-spacing: 0.08em;
            margin: 0 0 0.5rem;
        }

        p.subtitle {
            margin: 0;
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 45px rgba(4, 6, 16, 0.6);
            animation: floatIn 420ms ease-out;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            border: 1px solid var(--panel-border);
            border-radius: 0.6rem;
            padding: 0.75rem 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--fg);
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 179, 71, 0.35);
        }

        .error {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        button {
            border: none;
            border-radius: 0.65rem;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #0c0f28;
            background: linear-gradient(120deg, var(--accent), var(--accent-strong));
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 142, 83, 0.35);
        }

        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 0.75rem;
        }

        .result-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .result-count {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(255, 179, 71, 0.15);
            color: var(--accent);
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            padding: 0.6rem;
            border-bottom: 1px solid var(--panel-border);
        }

        th {
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.8rem;
            color: var(--muted);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        a.issue-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .text-view {
            width: 100%;
            min-height: 160px;
            border-radius: 0.75rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px dashed var(--panel-border);
            font-family: "JetBrains Mono", "Space Mono", monospace;
            font-size: 0.85rem;
            color: var(--muted);
            overflow: auto;
        }

        .placeholder {
            color: var(--muted);
            text-align: center;
            padding: 1.5rem 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1>juTrack</h1>
            <p class="subtitle">Review your Jira activity stream directly from the browser.</p>
        </header>

        <main class="layout">
            <section class="panel form-panel">
                <form th:action="@{/query}" th:object="${form}" method="post">
                    <div>
                        <label for="jiraRootUrl">Jira root URL</label>
                        <input id="jiraRootUrl" type="url" placeholder="https://jira.example.com" th:field="*{jiraRootUrl}" />
                        <p class="error" th:if="${#fields.hasErrors('jiraRootUrl')}" th:errors="*{jiraRootUrl}"></p>
                    </div>

                    <div>
                        <label for="userName">User name</label>
                        <input id="userName" type="text" th:field="*{userName}" placeholder="jira-user" />
                        <p class="error" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></p>
                    </div>

                    <div>
                        <label for="password">Password / API token</label>
                        <input id="password" type="password" th:field="*{password}" placeholder="••••••" />
                        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <div>
                        <label for="startDate">Start date</label>
                        <input id="startDate" type="date" th:field="*{startDate}" />
                        <p class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></p>
                    </div>

                    <div>
                        <label for="endDate">End date</label>
                        <input id="endDate" type="date" th:field="*{endDate}" />
                        <p class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></p>
                    </div>

                    <p class="error" th:if="${#fields.hasErrors('dateRangeValid')}" th:errors="*{dateRangeValid}"></p>

                    <button type="submit">Fetch worklog</button>
                </form>
            </section>

            <section class="panel result-panel">
                <div class="result-header">
                    <h2>Results</h2>
                    <div class="result-count" th:text="${resultView.totalEntries} + ' events'">0 events</div>
                </div>

                <div th:if="${resultView.hasResults()}" class="result-content">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Issue</th>
                                <th>Action</th>
                                <th>Summary</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${resultView.entries}">
                                <td th:text="${entry.createdDisplay}">2026-01-01 08:00</td>
                                <td>
                                    <a class="issue-link" th:href="${entry.issueUrl}" th:text="${entry.issueKey}" target="_blank" rel="noopener noreferrer">ABC-123</a>
                                </td>
                                <td th:text="${entry.changeAction}">Transition</td>
                                <td th:text="${entry.summary}">Any summary provided by Jira</td>
                            </tr>
                        </tbody>
                    </table>

                    <div>
                        <h3>Text export</h3>
                        <pre class="text-view" th:text="${resultView.textView}">No data available.</pre>
                    </div>
                </div>

                <div class="placeholder" th:if="${!resultView.hasResults()}">
                    <p>Results will appear here after you submit a query.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
