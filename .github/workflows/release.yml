name: Release Build

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode -V clean install

      - name: Gather JAR artifacts
        run: |
          mkdir -p dist
          find . -path "*/target/*.jar" \
            -not -name "*.original" \
            -not -name "*sources.jar" \
            -not -name "*javadoc.jar" \
            -exec cp {} dist/ \;

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
